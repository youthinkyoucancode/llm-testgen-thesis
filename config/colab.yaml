# Colab configuration: identical to default.yaml except for the hardware knob.
# Used by experiments/colab_runner.ipynb. Keeping every experiment-relevant
# value the same as default.yaml is what keeps the B vs C comparison fair
# across machines: only the hardware changes, never the method.

model:
  provider: ollama
  name: qwen2.5-coder
  temperature: 0.2
  max_output_tokens: 2048
  # No num_gpu here: on Colab's T4 (16 GB VRAM) Ollama offloads all layers to
  # the GPU by default. The local default.yaml pins num_gpu: 0 only because the
  # dev laptop's 2 GB MX250 crashes the CUDA runner.
  #
  # num_ctx is NOT optional. Left unset, Ollama applies a small default window and
  # silently left-truncates anything larger, which is what voided the 2026-08-10
  # campaign. Measured on ollama 0.32.6 with qwen2.5-coder (2026-08-11), the same
  # 21,321-character prompt evaluated 2,050 tokens unset and 4,989 with this
  # pinned: a ~2048-token prompt window, which together with the 2048 output cap
  # produces exactly the 4,098-token ceiling seen in every voided record.
  # 32768 is qwen2.5-coder's native window and clears the largest target
  # (click/types.py, past 12k prompt tokens, plus the 2048 output cap) with room
  # to spare; on a T4 the extra KV cache costs about 1.8 GB, fine within 16 GB.
  num_ctx: 32768

generation:
  runs_per_module: 3
  seed: 42

loop:
  max_iterations: 3
  token_budget_per_module: 60000
  stop_on_no_gain: true

filters:
  parse_check: true
  execute_check: true
  coverage_gain: true
  mutation_kill: true

coverage:
  measure_branches: true

mutation:
  tool: mutmut
  modules_per_library_min: 3
  modules_per_library_max: 5

paths:
  results_dir: experiments/results
  figures_dir: experiments/figures

logging:
  level: INFO
  log_tokens: true
  log_model_id: true
  log_prompt_version: true
