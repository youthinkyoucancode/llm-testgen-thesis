# Target libraries (system under test) and mutation scope.
#
# Versions below are the latest stable on PyPI as of 2026-07-01, pinned for
# reproducibility. Isolation between the pipeline's own environment and the
# target under test works by sys.path precedence: every measurement runs in a
# subprocess whose PYTHONPATH puts the pinned sdist first, so the sdist shadows
# anything in the pipeline venv. That matters: the pipeline itself depends on
# click (via typer), and the sdist pin must win over typer's click, which it
# does. Mutation workspaces additionally get a full copy of the target package,
# so mutants never touch the pristine tree.
#
# Module selection (Menzel condition 4, pre-registered): executed 2026-08-03 by
# experiments/select_modules.py BEFORE any experiment run. Full per-module
# metrics for every candidate, including the excluded ones, are recorded in
# experiments/module_selection.json. Two modules were excluded by the disclosed
# 1200-SLOC tractability cap (click/core.py at 1836 SLOC, jinja2/compiler.py at
# 1449 SLOC, more_itertools/more.py at 2065 SLOC) and one by the zero-CC floor
# (slugify/__version__.py, a constants file).

selection_rule: >-
  Top 3 eligible modules per library by total cyclomatic complexity (radon cc,
  summed over functions and methods; classes expand to their methods to avoid
  double counting). Tie-breaks: higher single-block complexity, then more SLOC.
  Ineligible: __init__.py, __main__.py, conftest.py, anything with "test" in
  its path, modules with zero total complexity (nothing to mutate), and modules
  over 1200 SLOC (mutation tractability on the free T4; exclusions disclosed).
  If fewer than 3 modules remain, take all that do.

# Per-library run metadata:
#   tests_path    where the human suite lives inside the sdist (condition A)
#   runtime_deps  what the library imports at runtime (installed before runs)
#   test_deps     what its human suite additionally needs; starts from each
#                 project's dev requirements and gets corrected by the first
#                 Colab run if a suite reports a missing module.
libraries:
  - name: click
    version: "8.4.2"
    repo: https://github.com/pallets/click
    tests_path: tests
    runtime_deps: []
    test_deps: []
    mutation_modules:
      - src/click/types.py          # total CC 359, max 17, 784 SLOC
      - src/click/_termui_impl.py   # total CC 268, max 19, 617 SLOC
      - src/click/parser.py         # total CC 157, max 10, 331 SLOC

  - name: jinja2
    version: "3.1.6"
    repo: https://github.com/pallets/jinja
    tests_path: tests
    runtime_deps: [markupsafe]
    test_deps: [trio]
    mutation_modules:
      - src/jinja2/parser.py        # total CC 424, max 12, 852 SLOC
      - src/jinja2/environment.py   # total CC 372, max 13, 924 SLOC
      - src/jinja2/runtime.py       # total CC 302, max 15, 617 SLOC

  - name: markdown
    version: "3.10.2"
    repo: https://github.com/Python-Markdown/markdown
    tests_path: tests
    runtime_deps: []
    test_deps: [pyyaml]
    mutation_modules:
      - markdown/extensions/md_in_html.py   # total CC 239, max 25, 283 SLOC
      - markdown/inlinepatterns.py          # total CC 236, max 33, 489 SLOC
      - markdown/blockprocessors.py         # total CC 225, max 11, 345 SLOC

  - name: python-slugify
    version: "8.0.4"
    repo: https://github.com/un33k/python-slugify
    tests_path: test.py
    runtime_deps: [text-unidecode]
    test_deps: []
    mutation_modules:
      - slugify/slugify.py          # total CC 38, max 27, 119 SLOC
      - slugify/special.py          # total CC 4, max 4, 34 SLOC (only 2 eligible modules)

  - name: more-itertools
    version: "11.1.0"
    repo: https://github.com/more-itertools/more-itertools
    tests_path: tests
    runtime_deps: []
    test_deps: []
    mutation_modules:
      - more_itertools/recipes.py   # total CC 181, max 13, 562 SLOC (more.py capped at 2065 SLOC)

# 12 modules total across 5 libraries. The library set itself (5 pure-Python
# projects with clean unit-test surfaces) was fixed in the exposé; widening it
# is a supervisor conversation, not a config edit.
